<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Przegląd – Czwórki</title>
<script>try{if(localStorage.getItem("cz-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=70">
<style>
.page{max-width:720px}
.top{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px;font-size:13px}
.top span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.top span.bad{border-color:#b23b3b;color:#b23b3b;font-weight:700}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 14px}
.day.ok{border:2px solid #2f7d32}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px}
.dh h2{font-size:17px;margin:0}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:#f3e3a3;color:#5a4a00;white-space:nowrap}
.day.ok .badge{background:#d9f0da;color:#1f5e22}
.warn{background:#fbe4e4;color:#8f2525;border-radius:10px;padding:8px 10px;font-size:13px;margin:0 0 10px}
.warn div::before{content:"⚠ "}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:12px 0 6px}
.g{display:grid;gap:6px}
.gr{border-radius:10px;padding:7px 10px;color:#1b1b1b;font-size:13px;line-height:1.35}
.gr b{display:block;font-size:12px;text-transform:uppercase}
.gr i{font-style:normal;font-size:11px;opacity:.7}
.zielony{background:#a9d18e}.zolty{background:#f6df94}.pomaranczowy{background:#f4b183}.czerwony{background:#e89a9a}
.pz{background:#FFD84A;color:#141413;border-radius:12px;padding:10px 12px;font-size:13px}
.pz .y{background:#141413;color:#FFD84A;border-radius:8px;padding:5px 8px;font-weight:700;font-size:12px;margin:0 0 8px}
.pz .y span{color:#fff;font-weight:500}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.tiles div{background:#141413;color:#fff;border-radius:7px;text-align:center;padding:7px 4px;font-weight:800;font-size:12px}
details{margin-top:6px;font-size:13px}
summary{cursor:pointer;color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer;font-weight:600;text-decoration:none}
.btn.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.zap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 0 16px}
.zap h2{font-size:16px;margin:0 0 4px}.zap p{font-size:12px;color:var(--muted);margin:0 0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}.chips button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer}.chips button.on{background:var(--fg);color:var(--bg)}
.mx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mx table{border-collapse:separate;border-spacing:2px;font-size:11px}
.mx th,.mx td{padding:0;text-align:center}
.mx .nm{position:sticky;left:0;background:var(--card);text-align:left;padding:0 8px 0 0;white-space:nowrap;font-size:12px;z-index:1}
.mx .gh td.nm{font-weight:800;font-size:13px;padding-top:8px}
.mx th.d{width:22px;font-weight:600;color:var(--muted);line-height:1.1}
.mx th.d.we{color:#b23b3b}
.mx td.c{width:22px;height:22px;border-radius:5px}
.c1{background:rgba(95,184,101,.28);box-shadow:inset 0 0 0 1px rgba(95,184,101,.6)}.c0{background:#e06666}.cn{background:var(--line)}
.c1.rv{background:#3e9a44;box-shadow:none;color:#fff;font-weight:800}
.cw{background:var(--line);opacity:.5}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
</style>
</head>
<body>
<main class="page">
<p><a href="panel.html">← Panel</a> · <a href="./">Gra</a></p>
<h1>Przegląd treści</h1>
<p style="color:var(--muted);font-size:14px;margin-top:-6px">Gra, post (7:30) i rolka (19:00) na najbliższe dni. Sprawdź i zaznacz „Sprawdzone”. Poprawki napisz Claude'owi albo zmień grę w panelu.</p>
<div id="app">Wczytywanie…</div>
</main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const fmt = (d) => new Date(d + "T12:00:00").toLocaleDateString("pl-PL", { weekday: "long", day: "numeric", month: "long" });
const short = (d) => d ? new Date(d + "T12:00:00").toLocaleDateString("pl-PL", { day: "numeric", month: "numeric" }) : "–";
const dleft = (d, t) => d ? Math.round((Date.parse(d) - Date.parse(t)) / 864e5) : -1;
let DATA;
let KRAJ = null;
function matrix() {
  const P = DATA.pokrycie; if (!P) return "";
  const kraje = [...new Set(P.gry.map((g) => g.kraj))]; if (!KRAJ || !kraje.includes(KRAJ)) KRAJ = kraje[0];
  const head = P.dni.map((d) => { const dt = new Date(d + "T12:00:00"), we = [0, 6].includes(dt.getDay()); return `<th class="d${we ? " we" : ""}">${["nd","pn","wt","śr","cz","pt","sb"][dt.getDay()]}<br>${dt.getDate()}</th>`; }).join("");
  const rows = P.gry.filter((g) => g.kraj === KRAJ).map((g) => {
    const gh = `<tr class="gh"><td class="nm">${esc(g.gra)}${g.status !== "aktywna" ? ' <span style="font-weight:500;color:var(--muted)">· wkrótce</span>' : ""}</td>${P.dni.map(() => "<td></td>").join("")}</tr>`;
    if (!g.kanaly.length) return gh + `<tr><td class="nm" style="color:var(--muted)">—</td>${P.dni.map(() => '<td class="c cw"></td>').join("")}</tr>`;
    return gh + g.kanaly.map((k) => `<tr><td class="nm">${esc(k.nazwa)}</td>${k.dni.map((v, i) => `<td class="c ${v === null ? "cn" : v ? "c1" : "c0"}${v && P.sprawdzone[i] ? " rv" : ""}" title="${P.dni[i]}">${v && P.sprawdzone[i] ? "✓" : ""}</td>`).join("")}</tr>`).join("");
  }).join("");
  const miss = P.gry.filter((g) => g.kraj === KRAJ).flatMap((g) => g.kanaly.map((k) => { const i = k.dni.findIndex((v) => v === 0); return i >= 0 ? `${g.gra}: ${k.nazwa} – brak od ${short(P.dni[i])}` : null; })).filter(Boolean);
  return `<div class="zap"><h2>Zapas treści – 30 dni</h2><p>${miss.length ? `<span style="color:#b23b3b;font-weight:700">⚠ ${esc(miss.slice(0, 3).join(" · "))}${miss.length > 3 ? " …" : ""}</span>` : "Treści przygotowane na 30 dni. Ciemnozielone = sprawdzone przez Ciebie."}</p>
    ${kraje.length > 1 ? `<div class="chips">${kraje.map((k) => `<button data-kraj="${k}" class="${k === KRAJ ? "on" : ""}">${k}</button>`).join("")}</div>` : ""}
    <div class="mx"><table><tr><th class="nm">Kraj: ${esc(KRAJ)}</th>${head}</tr>${rows}</table></div>
    <div class="lg"><span><i class="c1"></i>gotowe – do sprawdzenia</span><span><i class="c1 rv"></i>sprawdzone</span><span><i class="c0"></i>brak – dopisać</span><span><i class="cn"></i>nie dotyczy</span></div></div>`;
}
document.addEventListener("click", (e) => { const b = e.target.closest("button[data-kraj]"); if (b) { KRAJ = b.dataset.kraj; render(); } });

async function load() {
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch("panel/api/przeglad?dni=7", { cache: "no-store", signal: ctl.signal }); clearTimeout(t);
    if (!r.ok || !(r.headers.get("content-type") || "").includes("json")) throw 0;
    DATA = await r.json();
  } catch { location.replace("panel.html?go=przeglad"); return; }
  render();
}
function render() {
  const { today, days, zapas } = DATA;
  const z = (lab, d) => { const n = dleft(d, today); return `<span class="${n < 7 ? "bad" : ""}">${lab}: do ${short(d)}${n < 7 ? " – dopisz!" : ""}</span>`; };
  const todo = days.slice(1, 4).filter((x) => !x.done).length;
  document.getElementById("app").innerHTML = matrix() +
    `<div class="top">${z("Gra", zapas.gra)}${z("Posty", zapas.posty)}${z("Rolki", zapas.rolki)}${todo ? `<span class="bad">Do sprawdzenia (3 dni): ${todo}</span>` : `<span>Najbliższe 3 dni sprawdzone ✓</span>`}</div>` +
    days.map((x, i) => {
      const lab = i === 0 ? "Dziś" : i === 1 ? "Jutro" : i === 2 ? "Pojutrze" : "";
      return `<section class="day${x.done ? " ok" : ""}">
        <div class="dh"><h2>${lab ? lab + " · " : ""}${esc(fmt(x.d))}</h2><span class="badge">${x.done ? "✓ sprawdzone" : "do sprawdzenia"}</span></div>
        ${x.warn.length ? `<div class="warn">${x.warn.map((w) => `<div>${esc(w)}</div>`).join("")}</div>` : ""}
        <h3>Gra</h3><div class="g">${x.gra.map((g) => `<div class="gr ${esc(g.kolor)}"><b>${esc(g.kategoria)}${g.zdjecie ? "" : " <i>· bez zdjęcia</i>"}</b>${esc(g.slowa.join(", "))}</div>`).join("") || "<p>—</p>"}</div>
        <div class="two">
          <div><h3>Post · 7:30</h3>${x.media && x.media.post ? `<img src="${x.media.post}" alt="" style="width:100%;border-radius:10px;display:block;margin:0 0 6px" loading="lazy">` : ""}${x.post ? `<div class="pz">${x.prev ? `<div class="y">Wczoraj: ${esc(x.prev.odpowiedz)}<br><span>${esc(x.prev.slowa.join(", "))}</span></div>` : ""}<div class="tiles">${[x.post.slowo1, x.post.slowo2, x.post.slowo3, x.post.slowo4].map((w) => `<div>${esc(w)}</div>`).join("")}</div></div><details><summary>Odpowiedź</summary><b>${esc(x.post.odpowiedz)}</b> – ${esc(x.post.wyjasnienie)}</details>` : "<p>—</p>"}</div>
          <div><h3>Rolka · 19:00</h3>${x.media && x.media.rolka ? `<video src="${x.media.rolka}" controls playsinline preload="metadata" style="width:100%;max-height:420px;border-radius:10px;background:#000;display:block;margin:0 0 6px"></video>` : ""}${x.rolka ? `<div class="pz"><div class="tiles">${[x.rolka.slowo1, x.rolka.slowo2, x.rolka.slowo3, x.rolka.slowo4].map((w) => `<div>${esc(w)}</div>`).join("")}</div></div><details><summary>Odpowiedź</summary><b>${esc(x.rolka.odpowiedz)}</b> – ${esc(x.rolka.wyjasnienie)}</details>` : "<p>—</p>"}</div>
        </div>
        <div class="acts"><button class="btn ${x.done ? "" : "dark"}" data-d="${x.d}" data-ok="${x.done ? 0 : 1}">${x.done ? "Cofnij" : "✓ Sprawdzone"}</button><a class="btn" href="panel.html#${x.d}">Edytuj grę</a></div>
      </section>`;
    }).join("");
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-d]"); if (!b) return;
  b.disabled = true;
  await fetch("panel/api/przeglad", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ d: b.dataset.d, ok: b.dataset.ok === "1" }) });
  load();
});
load();
</script>
</body>
</html>
