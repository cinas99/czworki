<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel – Czwórki</title>
<script>try{if(localStorage.getItem("cz-theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=17">
<style>
.page{max-width:760px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:14px}
.box input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;margin:6px 0}
.ok{color:#2f7d32}.warn{color:#b23b3b}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:500}
.btn.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.sm{padding:4px 9px;font-size:12px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.summary div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.summary b{display:block;font-size:22px}
.summary span{font-size:12px;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.bar .on{background:var(--fg);color:var(--bg)}
.day{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 0 14px}
.day.today{border:2px solid var(--fg)}
.day-h{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;gap:8px}
.day-h h2{font-size:16px;margin:0}
.day-h small{font-size:13px}
.day-h a{font-size:13px;color:var(--fg);white-space:nowrap}
.gs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.gs{grid-template-columns:1fr}}
.gc{position:relative;border-radius:10px;overflow:hidden;min-height:150px;background:#333;color:#fff;border-left:8px solid var(--gc);border-right:8px solid var(--gc);display:flex;flex-direction:column}
.gc .ph{position:absolute;inset:0;background-size:cover;background-position:center}
.gc .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.75))}
.gc .tx{position:relative;padding:28px 10px 8px;flex:1;display:flex;flex-direction:column;justify-content:flex-end;text-shadow:0 1px 3px #000}
.gc b{text-transform:uppercase;font-size:13px}
.gc .w{font-size:12px}
.gc .ex{font-size:11px;opacity:.9;margin-top:3px;line-height:1.35}
.gc .src{position:absolute;top:6px;left:8px;right:8px;font-size:10px;z-index:2}
.gc .src span{background:rgba(0,0,0,.55);padding:2px 6px;border-radius:999px}
.gc .src span.bad{background:#b23b3b}
.gc .acts{position:relative;display:flex;gap:5px;padding:0 8px 8px;flex-wrap:wrap}
.gc .acts button{border:none;background:rgba(255,255,255,.88);color:#111;border-radius:999px;padding:4px 9px;font-size:11.5px;cursor:pointer;font-weight:600}
.gc.noimg{background:var(--gc);color:#222}
.gc.noimg .tx{text-shadow:none}
dialog.ed{max-width:560px;width:calc(100% - 24px);max-height:90vh;overflow:auto}
.ed label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.ed input,.ed textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
.ed .w4{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ed .row2{display:flex;gap:6px}
.ed .row2 input{flex:1}
.prev{height:120px;border-radius:10px;background:#444 center/cover;margin-top:8px;position:relative}
.prev span{position:absolute;left:8px;bottom:6px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:999px}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.res button{border:2px solid transparent;padding:0;border-radius:8px;overflow:hidden;cursor:pointer;background:#222;text-align:left}
.res button:hover{border-color:var(--fg)}
.res img{width:100%;height:80px;object-fit:cover;display:block}
.res small{display:block;font-size:10px;color:#ddd;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err{color:#b23b3b;font-size:13px;min-height:18px;margin:8px 0 0}
.foot-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.rz{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.rz b{text-transform:uppercase;font-size:13px}
.rz div{font-size:12px;color:var(--muted)}
.rz.bad{opacity:.45}
.lock{padding:40px 0;text-align:center}
</style>
</head>
<body>
<main class="page">
<p><a href="./">← Gra</a> · <a href="https://github.com/cinas99/czworki/blob/main/zagadki.csv" target="_blank" rel="noopener">Baza na GitHubie</a></p>
<h1>Panel zagadek</h1>
<div id="app">Wczytywanie…</div>
</main>

<dialog class="ed" id="dlg-edit">
  <h2 id="ed-title">Edytuj grupę</h2>
  <label>Kategoria</label><input id="ed-kat">
  <label>Słowa</label>
  <div class="w4"><input id="ed-w1"><input id="ed-w2"><input id="ed-w3"><input id="ed-w4"></div>
  <label>Wyjaśnienie (do archiwum)</label><textarea id="ed-ex" rows="2"></textarea>
  <label>Zdjęcie: hasła z Wikipedii oddzielone | albo adres URL</label>
  <div class="row2"><input id="ed-img"><button class="btn sm" id="ed-retry" type="button">↻ Sprawdź</button></div>
  <div class="prev" id="ed-prev"><span id="ed-prev-t">brak zdjęcia</span></div>
  <label>Szukaj zdjęcia</label>
  <div class="row2"><input id="ed-q" placeholder="np. rzeka, samochód, Pinokio"><button class="btn sm dark" id="ed-search" type="button">Szukaj</button></div>
  <div class="res" id="ed-res"></div>
  <p class="err" id="ed-err"></p>
  <div class="foot-btns"><button class="btn" id="ed-cancel" type="button">Anuluj</button><button class="btn dark" id="ed-save" type="button">Zapisz</button></div>
</dialog>

<dialog class="ed" id="dlg-swap">
  <h2>Wymień grupę</h2>
  <p style="font-size:14px;color:var(--muted);margin-top:0">Wybierz grupę z rezerwy. Wymieniana grupa trafi do rezerwy, więc nic nie zginie. Wyszarzone grupy mają słowa, które już są w tym dniu.</p>
  <div id="swap-list"></div>
  <div class="foot-btns"><button class="btn" id="swap-cancel" type="button">Zamknij</button></div>
</dialog>

<div class="toast" id="toast" hidden></div>

<script src="images.js?v=17"></script>
<script>
(async () => {
  const REPO = "cinas99/czworki", BRANCH = "main";
  const $ = (id) => document.getElementById(id);
  const app = $("app");
  const q = new URLSearchParams(location.search);
  try { if (q.has("admin")) localStorage.setItem("cz-admin", "1"); } catch {}
  let admin = false; try { admin = localStorage.getItem("cz-admin") === "1"; } catch {}
  if (!admin) { app.innerHTML = '<p class="lock">Panel jest dostępny w trybie admina. Otwórz <b>panel.html?admin</b>.</p>'; return; }

  const LV = { zielony: 0, zolty: 1, pomaranczowy: 2, czerwony: 3 };
  const today = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Warsaw" }).format(new Date());
  const esc = (s) => (s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const toast = (t, ms = 2600) => { const el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), ms); };

  // ---- CSV ----
  function parseCSV(t) {
    const rows = []; let row = [], cur = "", qq = false;
    for (let i = 0; i < t.length; i++) {
      const c = t[i];
      if (qq) { if (c === '"') { if (t[i + 1] === '"') { cur += '"'; i++; } else qq = false; } else cur += c; }
      else if (c === '"') qq = true;
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(cur); rows.push(row); row = []; cur = ""; }
      else cur += c;
    }
    if (cur || row.length) { row.push(cur); rows.push(row); }
    const head = rows.shift().map((x) => x.trim());
    return { head, rows: rows.filter((r) => r.some((x) => x.trim())).map((r) => Object.fromEntries(head.map((k, i) => [k, (r[i] || "").trim()]))) };
  }
  const cell = (v) => (/[",\r\n]/.test(v || "") ? '"' + v.replace(/"/g, '""') + '"' : v || "");
  const toCSV = (head, rows) => [head.join(","), ...rows.map((r) => head.map((h) => cell(r[h])).join(","))].join("\r\n") + "\r\n";

  // ---- GitHub ----
  let token = ""; try { token = localStorage.getItem("cz-gh-token") || ""; } catch {}
  const b64dec = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, "")), (c) => c.charCodeAt(0)));
  const b64enc = (s) => { const u = new TextEncoder().encode(s); let bin = ""; for (let i = 0; i < u.length; i += 0x8000) bin += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(bin); };
  const gh = (path, opt = {}) => fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, { ...opt, headers: { Authorization: "Bearer " + token, Accept: "application/vnd.github+json", ...(opt.headers || {}) } });
  async function load(path) {
    if (token) {
      const r = await gh(path + "?ref=" + BRANCH);
      if (r.ok) { const j = await r.json(); return { text: b64dec(j.content), sha: j.sha }; }
      if (r.status === 401) { toast("Token jest nieprawidłowy albo wygasł"); token = ""; }
      if (r.status === 404 && path === "zapas.csv") return { text: "kategoria,slowo1,slowo2,slowo3,slowo4,zdjecie,wyjasnienie\n", sha: null };
    }
    const r = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
    return { text: r.ok ? await r.text() : "kategoria,slowo1,slowo2,slowo3,slowo4,zdjecie,wyjasnienie\n", sha: null };
  }
  async function save(path, text, sha, msg) {
    const r = await gh(path, { method: "PUT", body: JSON.stringify({ message: msg, content: b64enc(text), branch: BRANCH, ...(sha ? { sha } : {}) }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(r.status === 409 ? "Plik zmienił się w międzyczasie. Odśwież panel." : (j.message || "Błąd zapisu " + r.status)); }
    return (await r.json()).content.sha;
  }

  let Z, R, zSha, rSha;
  async function reload() {
    const a = await load("zagadki.csv"), b = await load("zapas.csv");
    Z = parseCSV(a.text); zSha = a.sha; R = parseCSV(b.text); rSha = b.sha;
    if (!Z.head.includes("wyjasnienie")) Z.head.push("wyjasnienie");
  }
  await reload();

  const byDay = () => { const m = new Map(); Z.rows.forEach((r) => { if (!m.has(r.data)) m.set(r.data, []); m.get(r.data).push(r); }); return m; };
  const words = (r) => [r.slowo1, r.slowo2, r.slowo3, r.slowo4].map((w) => (w || "").toUpperCase());
  function problems(g) {
    const out = [];
    if (g.length !== 4) out.push(`${g.length} grup zamiast 4`);
    const ws = g.flatMap(words), dup = ws.filter((w, i) => w && ws.indexOf(w) !== i);
    if (dup.length) out.push("powtórzone słowa: " + [...new Set(dup)].join(", "));
    if (g.some((x) => !x.wyjasnienie)) out.push("brak wyjaśnienia");
    if (g.some((x) => !x.zdjecie)) out.push("brak hasła zdjęcia");
    return out;
  }
  const fmt = (d) => new Date(d + "T12:00:00Z").toLocaleDateString("pl-PL", { weekday: "short", day: "numeric", month: "long" });

  let filter = "future";
  function render() {
    const m = byDay(), all = [...m.keys()].sort(), future = all.filter((d) => d >= today);
    const warnDays = future.filter((d) => problems(m.get(d)).length);
    const last = all[all.length - 1];
    let list = filter === "past" ? all.filter((d) => d < today).reverse() : filter === "warn" ? warnDays : future;
    app.innerHTML = `
      <div class="box">${token
        ? `<span class="ok">● Połączono z GitHubem</span>: zmiany zapisują się od razu w repo i są na stronie po ok. minucie. <button class="btn sm" id="gh-out">Rozłącz</button>`
        : `<b>Połącz z GitHubem, żeby zapisywać zmiany.</b> Bez tego panel działa tylko do podglądu.
           <input id="gh-token" type="password" placeholder="Wklej token (github_pat_…)">
           <button class="btn dark sm" id="gh-in">Połącz</button>
           <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener" style="font-size:13px;margin-left:8px">Utwórz token →</a>
           <div style="font-size:12px;color:var(--muted);margin-top:6px">Token: „Only select repositories” → czworki; uprawnienie Repository permissions → Contents: Read and write. Token zostaje tylko w tej przeglądarce.</div>`}
      </div>
      <div class="summary">
        <div><b>${future.length}</b><span>dni w zapasie</span></div>
        <div><b>${last ? new Date(last + "T12:00:00Z").toLocaleDateString("pl-PL", { day: "numeric", month: "short" }) : "–"}</b><span>ostatnia zagadka</span></div>
        <div><b>${R.rows.length}</b><span>grup w rezerwie</span></div>
      </div>
      <div class="bar">
        <button class="btn ${filter === "future" ? "on" : ""}" data-f="future">Od dziś</button>
        <button class="btn ${filter === "past" ? "on" : ""}" data-f="past">Archiwum</button>
        <button class="btn ${filter === "warn" ? "on" : ""}" data-f="warn">Z uwagami${warnDays.length ? " (" + warnDays.length + ")" : ""}</button>
      </div>
      <div id="days">${list.map((d) => {
        const g = m.get(d).slice().sort((a, b) => (LV[a.kolor] ?? 0) - (LV[b.kolor] ?? 0)), pr = problems(g);
        return `<section class="day${d === today ? " today" : ""}">
          <div class="day-h"><div><h2>#${all.indexOf(d) + 1} · ${fmt(d)}${d === today ? " · dziś" : ""}</h2>${pr.length ? `<small class="warn">⚠ ${esc(pr.join("; "))}</small>` : ""}</div>
          <a href="./?admin&dzien=${d}">Zagraj →</a></div>
          <div class="gs">${g.map((x) => { const i = Z.rows.indexOf(x); return `<div class="gc c${LV[x.kolor] ?? 0}" data-i="${i}">
            <div class="ph"></div><div class="src"><span>szukam zdjęcia…</span></div>
            <div class="tx"><b>${esc(x.kategoria)}</b><span class="w">${esc(words(x).join(", "))}</span>${x.wyjasnienie ? `<span class="ex">${esc(x.wyjasnienie)}</span>` : ""}</div>
            <div class="acts"><button data-a="edit">✎ Edytuj</button><button data-a="swap">⇄ Wymień</button><button data-a="photo">🔍 Zdjęcie</button><button data-a="retry">↻</button></div>
          </div>`; }).join("")}</div></section>`;
      }).join("") || "<p>Brak dni do pokazania.</p>"}</div>`;

    app.querySelectorAll(".bar button").forEach((b) => (b.onclick = () => { filter = b.dataset.f; render(); }));
    if ($("gh-in")) $("gh-in").onclick = async () => {
      const t = $("gh-token").value.trim(); if (!t) return toast("Wklej token");
      token = t;
      const r = await gh("zagadki.csv?ref=" + BRANCH);
      if (!r.ok) { token = ""; return toast(r.status === 401 ? "Nieprawidłowy token" : "Token nie ma dostępu do repo czworki"); }
      try { localStorage.setItem("cz-gh-token", t); } catch {}
      await reload(); render(); toast("Połączono z GitHubem");
    };
    if ($("gh-out")) $("gh-out").onclick = () => { try { localStorage.removeItem("cz-gh-token"); } catch {} token = ""; render(); };
    app.querySelectorAll(".gc").forEach((el) => {
      const row = Z.rows[+el.dataset.i];
      paint(el, row);
      el.querySelectorAll(".acts button").forEach((b) => (b.onclick = () => {
        if (b.dataset.a === "edit") openEdit(row, false);
        if (b.dataset.a === "photo") openEdit(row, true);
        if (b.dataset.a === "swap") openSwap(row);
        if (b.dataset.a === "retry") paint(el, row, true);
      }));
    });
  }
  async function paint(el, row, fresh) {
    const tag = el.querySelector(".src span"); tag.textContent = "szukam zdjęcia…"; tag.classList.remove("bad");
    const im = await window.czImage(row.zdjecie, fresh);
    if (!im) { el.classList.add("noimg"); el.querySelector(".ph").style.backgroundImage = ""; tag.textContent = row.zdjecie ? "brak zdjęcia: " + row.zdjecie : "brak hasła zdjęcia"; tag.classList.add("bad"); return; }
    el.classList.remove("noimg");
    el.querySelector(".ph").style.backgroundImage = `url("${im.src}")`;
    tag.textContent = /^https?:/.test(im.title) ? "własny adres" : im.title;
  }

  // ---- Edycja ----
  let editing = null;
  async function preview(fresh) {
    const im = await window.czImage($("ed-img").value, fresh);
    $("ed-prev").style.backgroundImage = im ? `url("${im.src}")` : "";
    $("ed-prev-t").textContent = im ? (/^https?:/.test(im.title) ? "własny adres" : im.title) : "brak zdjęcia dla tych haseł";
  }
  function openEdit(row, photoFirst) {
    editing = row;
    $("ed-title").textContent = `Edytuj grupę · ${fmt(row.data)}`;
    $("ed-kat").value = row.kategoria; words(row).forEach((w, i) => ($("ed-w" + (i + 1)).value = w));
    $("ed-ex").value = row.wyjasnienie || ""; $("ed-img").value = row.zdjecie || "";
    $("ed-q").value = row.kategoria.replace(/[_.…()/]/g, " ").replace(/\s+/g, " ").trim();
    $("ed-res").innerHTML = ""; $("ed-err").textContent = "";
    preview();
    $("dlg-edit").showModal();
    if (photoFirst) { $("ed-q").focus(); doSearch(); }
  }
  async function doSearch() {
    const qv = $("ed-q").value.trim(); if (!qv) return;
    $("ed-res").innerHTML = "<small>Szukam…</small>";
    const res = await window.czImage.search(qv);
    $("ed-res").innerHTML = res.length ? "" : "<small>Nic nie znaleziono. Spróbuj innego słowa.</small>";
    res.forEach((r) => {
      const b = document.createElement("button"); b.type = "button";
      b.innerHTML = `<img src="${esc(r.thumb)}" alt="" loading="lazy"><small>${esc(r.kind)} · ${esc(r.label)}</small>`;
      b.onclick = () => { $("ed-img").value = r.value; preview(); };
      $("ed-res").appendChild(b);
    });
  }
  $("dlg-edit").addEventListener("input", () => ($("ed-err").textContent = ""));
  $("ed-search").onclick = doSearch;
  $("ed-q").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); doSearch(); } };
  $("ed-retry").onclick = () => preview(true);
  $("ed-img").onchange = () => preview();
  $("ed-cancel").onclick = () => $("dlg-edit").close();
  $("ed-save").onclick = async () => {
    const ws = [1, 2, 3, 4].map((i) => $("ed-w" + i).value.trim().toUpperCase());
    const kat = $("ed-kat").value.trim();
    if (!kat || ws.some((w) => !w)) return ($("ed-err").textContent = "Wpisz kategorię i wszystkie 4 słowa.");
    if (new Set(ws).size < 4) return ($("ed-err").textContent = "Słowa w grupie się powtarzają.");
    const others = byDay().get(editing.data).filter((r) => r !== editing).flatMap(words);
    const clash = ws.filter((w) => others.includes(w));
    if (clash.length) return ($("ed-err").textContent = "Te słowa są już w innej grupie tego dnia: " + clash.join(", "));
    if (!token) return ($("ed-err").textContent = "Połącz panel z GitHubem (u góry), żeby zapisać.");
    const backup = { ...editing };
    Object.assign(editing, { kategoria: kat, slowo1: ws[0], slowo2: ws[1], slowo3: ws[2], slowo4: ws[3], wyjasnienie: $("ed-ex").value.trim(), zdjecie: $("ed-img").value.trim() });
    $("ed-save").disabled = true;
    try { zSha = await save("zagadki.csv", toCSV(Z.head, Z.rows), zSha, `Panel: zmiana grupy „${kat}” (${editing.data})`); $("dlg-edit").close(); render(); toast("Zapisano. Na stronie za ok. minutę."); }
    catch (e) { Object.assign(editing, backup); $("ed-err").textContent = e.message; }
    $("ed-save").disabled = false;
  };

  // ---- Wymiana z rezerwy ----
  function openSwap(row) {
    const others = byDay().get(row.data).filter((r) => r !== row).flatMap(words);
    $("swap-list").innerHTML = R.rows.length ? "" : "<p>Rezerwa jest pusta.</p>";
    R.rows.forEach((g) => {
      const ws = words(g), clash = ws.filter((w) => others.includes(w));
      const el = document.createElement("div"); el.className = "rz" + (clash.length ? " bad" : "");
      el.innerHTML = `<div><b>${esc(g.kategoria)}</b><div>${esc(ws.join(", "))}${clash.length ? " · koliduje: " + esc(clash.join(", ")) : ""}</div></div>`;
      const b = document.createElement("button"); b.className = "btn sm dark"; b.textContent = "Użyj"; b.disabled = !!clash.length;
      b.onclick = async () => {
        if (!token) return toast("Połącz panel z GitHubem, żeby zapisać");
        const old = { kategoria: row.kategoria, slowo1: row.slowo1, slowo2: row.slowo2, slowo3: row.slowo3, slowo4: row.slowo4, zdjecie: row.zdjecie, wyjasnienie: row.wyjasnienie };
        const zBackup = { ...row }, rBackup = R.rows.slice();
        Object.assign(row, { kategoria: g.kategoria, slowo1: g.slowo1, slowo2: g.slowo2, slowo3: g.slowo3, slowo4: g.slowo4, zdjecie: g.zdjecie, wyjasnienie: g.wyjasnienie });
        R.rows.splice(R.rows.indexOf(g), 1); R.rows.push(old);
        b.disabled = true;
        try {
          zSha = await save("zagadki.csv", toCSV(Z.head, Z.rows), zSha, `Panel: „${old.kategoria}” → „${g.kategoria}” (${row.data})`);
          rSha = await save("zapas.csv", toCSV(R.head, R.rows), rSha, `Panel: „${old.kategoria}” wraca do rezerwy`);
          $("dlg-swap").close(); render(); toast("Wymieniono. Na stronie za ok. minutę.");
        } catch (e) { Object.assign(row, zBackup); R.rows = rBackup; toast(e.message, 4000); b.disabled = false; }
      };
      el.appendChild(b); $("swap-list").appendChild(el);
    });
    $("dlg-swap").showModal();
  }
  $("swap-cancel").onclick = () => $("dlg-swap").close();

  render();
})();
</script>
</body>
</html>
