<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;background:#FFD84A;font-family:Inter,sans-serif;color:#141413;padding:230px 90px 420px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.logo{display:flex;align-items:center;gap:16px;font-weight:800;font-size:52px;letter-spacing:-1px}
.mk{display:grid;grid-template-columns:26px 26px;gap:6px}.mk i{width:26px;height:26px;border-radius:7px;background:#141413}.mk i:last-child{background:#fff}
h1{font-size:104px;line-height:1.02;font-weight:800;letter-spacing:-3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:100%}
.t{height:170px;border-radius:28px;background:#141413;color:#fff;display:grid;place-items:center;font-weight:800;font-size:50px;padding:0 10px}
.timer{display:flex;align-items:center;gap:26px;width:100%}
.n{font-size:110px;font-weight:800;width:150px;letter-spacing:-4px}
.bar{flex:1;height:30px;border-radius:99px;background:rgba(20,20,19,.15);overflow:hidden}
.bar i{display:block;height:100%;background:#141413;border-radius:99px}
.end{font-size:70px;font-weight:800;line-height:1.1;letter-spacing:-1px}
.sub{font-size:44px;font-weight:600;line-height:1.3}
.cta{background:#141413;color:#fff;border-radius:999px;padding:28px 56px;font-weight:800;font-size:54px}
</style></head><body><div id="c" style="display:contents"></div></body></html>
