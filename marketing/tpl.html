<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;background:#FFD84A;font-family:Inter,sans-serif;color:#141413;padding:84px 84px 78px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;font-size:30px}
.logo{display:flex;align-items:center;gap:16px;font-weight:800;font-size:44px;letter-spacing:-1px}
.mk{display:grid;grid-template-columns:22px 22px;gap:5px}.mk i{width:22px;height:22px;border-radius:6px;background:#141413}.mk i:last-child{background:#fff}
.tag{font-weight:500}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:40px}
h1{font-size:96px;line-height:1.02;font-weight:800;letter-spacing:-3px}
h1.m{font-size:78px;letter-spacing:-2px}
.sub{font-size:40px;line-height:1.3;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr);gap:14px}
.t{height:150px;border-radius:24px;background:#FFF8E6;display:grid;place-items:center;font-weight:800;font-size:42px;letter-spacing:.5px;text-align:center;padding:0 10px}
.grid.c4 .t{height:118px;font-size:26px;border-radius:18px}
.t.d{background:#141413;color:#fff}
.t.x{outline:5px dashed #C0392B;outline-offset:-5px}
.row{background:#141413;color:#fff;border-radius:24px;padding:40px;text-align:center}
.row b{display:block;font-size:52px;color:#FFD84A;font-weight:800;letter-spacing:1px}
.row span{font-size:34px;font-weight:600}
.hearts{font-size:64px;letter-spacing:10px;color:#D64545}
.foot{display:flex;align-items:center;gap:30px;font-size:30px;font-weight:500;padding:0 0 26px 18px;white-space:nowrap}
.cta{background:#141413;color:#fff;border-radius:999px;padding:24px 44px;font-weight:800;font-size:40px}
.big{font-size:200px;font-weight:800;letter-spacing:-8px;line-height:1}
.msg{display:inline-block;background:#fff;border-radius:999px;padding:18px 34px;font-size:38px;font-weight:700;color:#C0392B;align-self:flex-start}
</style></head><body>
<div class="top"><div class="logo"><div class="mk"><i></i><i></i><i></i><i></i></div>Czwórki</div><div class="tag">codzienna łamigłówka słowna</div></div>
<div class="main" id="main"></div>
<div class="foot"><span class="cta">czworki.pl</span><span id="foot">Nowa zagadka codziennie. Za darmo.</span></div>
</body></html>
